name: 每日自动更新 Mihomo 规则集

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 02:00（北京时间 10:00）运行
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

# 与 SingBox 规则集 workflow 共用同一并发组：两者同一时间触发且都推送到同一分支，
# 排队执行可避免推送冲突
concurrency:
  group: rules-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 修复 Node.js 版本警告

defaults:
  run:
    shell: bash            # 显式指定后默认带 -eo pipefail，管道中任一命令失败即报错

jobs:
  update-mihomo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RULES_DIR: ${{ github.workspace }}/rules
      CURL_OPTS: >-
        -fsSL --retry 3 --retry-delay 5 --retry-all-errors
        --connect-timeout 15 --max-time 300

    steps:
      # ── 1. 检出仓库 ──────────────────────────────────────────
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}   # 用 PAT 检出，后续 git push 自动复用该凭据

      # ── 2. 准备目录与公共函数 ─────────────────────────────────
      - name: 准备目录与公共函数
        run: |
          mkdir -p "$RULES_DIR"
          WORK_DIR="$RUNNER_TEMP/build"   # 中间文件放临时目录，避免污染仓库工作区
          mkdir -p "$WORK_DIR"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"

          # 公共函数写入 lib.sh，各步骤 source 复用，避免重复粘贴
          cat > "$WORK_DIR/lib.sh" <<'LIB'
          # 带回退的下载：GitHub → GitLab 镜像
          download_hagezi() {
            local path="$1" output="$2"
            local github_url="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/${path}"
            local gitlab_url="https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/${path}"
            echo "尝试从 GitHub 下载: ${github_url}"
            if curl $CURL_OPTS "${github_url}" -o "${output}"; then
              echo "✅ GitHub 下载成功"
              return 0
            fi
            echo "::warning::GitHub 不可用，切换到 GitLab 镜像: ${gitlab_url}"
            if curl $CURL_OPTS "${gitlab_url}" -o "${output}"; then
              echo "✅ GitLab 镜像下载成功"
              return 0
            fi
            echo "::error::GitHub 和 GitLab 镜像均不可用: ${path}"
            return 1
          }

          # 纯域名列表 → mihomo domain yaml
          # 使用 '+.' 前缀：同时匹配域名本身及其所有子域名
          # （'.' 前缀只匹配子域名，会漏掉主域名本身）
          domains_to_yaml() {
            python3 - "$1" "$2" <<'PY'
          import sys
          src, dst = sys.argv[1], sys.argv[2]
          domains = []
          with open(src, encoding="utf-8") as f:
              for line in f:
                  line = line.split("#", 1)[0].strip()
                  if not line:
                      continue
                  if line.startswith("*."):
                      line = line[2:]
                  domains.append(line.lstrip("."))
          domains = list(dict.fromkeys(d for d in domains if d))  # 去重并保持原顺序
          if not domains:
              sys.exit(f"::error::{src} 未提取到任何域名，上游格式可能已变化")
          with open(dst, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              f.writelines(f"  - '+.{d}'\n" for d in domains)
          print(f"[OK] 共处理 {len(domains)} 条域名")
          PY
            echo "--- ${2} 前 5 行预览 ---"
            head -5 "$2"
          }
          LIB

      # ── 3. 下载 mihomo ────────────────────────────────────────
      - name: 下载 mihomo
        working-directory: ${{ env.WORK_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}     # 只读 API 调用，无需 PAT
        run: |
          LATEST=$(curl $CURL_OPTS \
                     -H "Authorization: Bearer ${GH_TOKEN}" \
                     -H "Accept: application/vnd.github+json" \
                     https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
                   | jq -r '.tag_name')
          if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
            echo "::error::无法获取 mihomo 最新版本号"
            exit 1
          fi
          echo "最新版本: ${LATEST}"

          curl $CURL_OPTS \
            "https://github.com/MetaCubeX/mihomo/releases/download/${LATEST}/mihomo-linux-amd64-${LATEST}.gz" \
            -o mihomo.gz
          gunzip -f mihomo.gz
          sudo install -m 755 mihomo /usr/local/bin/mihomo
          mihomo -v

      # 以下每个规则步骤均 continue-on-error：单个上游失败不影响其他规则更新，
      # 失败的规则保留旧版本，最后在「汇总构建结果」步骤统一报错。
      # 所有产物先在临时目录生成，成功后才 mv 到 rules/，保证不会写入半成品。

      # ── 4. doh-ips（IP列表 → yaml → .mrs） ───────────────────
      - name: 生成 doh-ips.mrs
        id: doh_ips
        continue-on-error: true
        working-directory: ${{ env.WORK_DIR }}
        run: |
          source lib.sh
          download_hagezi "ips/doh.txt" doh-ips.txt

          python3 - <<'EOF'
          import ipaddress, sys

          entries, invalid = [], 0
          with open("doh-ips.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.split("#", 1)[0].strip()
                  if not line:
                      continue
                  try:
                      # 统一转为标准 CIDR（纯 IP 自动补 /32 或 /128）
                      entries.append(str(ipaddress.ip_network(line, strict=False)))
                  except ValueError:
                      invalid += 1

          entries = list(dict.fromkeys(entries))
          if not entries:
              sys.exit("::error::未提取到任何 IP-CIDR，上游格式可能已变化")
          if invalid:
              print(f"::warning::跳过 {invalid} 条无效行")

          with open("doh-ips.yaml", "w", encoding="utf-8") as f:
              f.write("payload:\n")
              f.writelines(f"  - '{e}'\n" for e in entries)

          print(f"[OK] 共处理 {len(entries)} 条 IP-CIDR")
          EOF

          head -5 doh-ips.yaml
          mihomo convert-ruleset ipcidr yaml doh-ips.yaml doh-ips.mrs
          mv doh-ips.mrs "$RULES_DIR/"

      # ── 5. doh 域名（域名列表 → yaml → .mrs） ────────────────
      - name: 生成 doh.mrs
        id: doh
        continue-on-error: true
        working-directory: ${{ env.WORK_DIR }}
        run: |
          source lib.sh
          download_hagezi "wildcard/doh-onlydomains.txt" doh.txt
          domains_to_yaml doh.txt doh.yaml
          mihomo convert-ruleset domain yaml doh.yaml doh.mrs
          mv doh.mrs "$RULES_DIR/"

      # ── 6. Hagezi Pro（wildcard域名 → yaml → .mrs） ───────────
      - name: 生成 Hagezi Blocklists Pro.mrs
        id: hagezi_pro
        continue-on-error: true
        working-directory: ${{ env.WORK_DIR }}
        run: |
          source lib.sh
          download_hagezi "wildcard/pro-onlydomains.txt" Hagezi-Blocklists-Pro.txt
          domains_to_yaml Hagezi-Blocklists-Pro.txt Hagezi-Blocklists-Pro.yaml
          mihomo convert-ruleset domain yaml Hagezi-Blocklists-Pro.yaml Hagezi-Blocklists-Pro.mrs
          # 保留原文件名（含空格），兼容已有订阅链接
          mv Hagezi-Blocklists-Pro.mrs "$RULES_DIR/Hagezi Blocklists Pro.mrs"

      # ── 7. 提交并推送到仓库 ───────────────────────────────────
      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --cached --quiet; then
            echo "规则文件无变化，跳过提交。"
            exit 0
          fi
          git commit -m "chore: 自动更新 Mihomo 规则集 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 推送前先 rebase，避免运行期间远端有新提交导致推送被拒
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ── 8. 汇总构建结果 ──────────────────────────────────────
      - name: 汇总构建结果
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          {
            echo "### Mihomo 规则集文件"
            echo '```'
            ls -lh "$RULES_DIR"/*.mrs 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          failed=$(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<<"$STEPS_JSON" | xargs)
          if [[ -n "$failed" ]]; then
            echo "::error::以下规则生成失败（已保留旧版本）: ${failed}"
            echo "**❌ 失败的规则:** ${failed}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**✅ 全部规则生成成功**" >> "$GITHUB_STEP_SUMMARY"