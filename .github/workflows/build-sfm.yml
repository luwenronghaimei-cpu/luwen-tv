name: Build SFM (reF1nd)

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: '内核版本 (分支名或 Tag，Tag 带 v 前缀如 v1.14.0-rc.4-reF1nd)'
        required: true
        type: choice
        default: 'reF1nd-testing'
        options:
          - reF1nd-testing
          - reF1nd-stable
          - reF1nd-testing-next
          - reF1nd-stable-next
          - reF1nd
      apple_ref:
        description: 'sing-box-for-apple 分支 (一般不用改)'
        required: true
        default: 'dev'

jobs:
  build:
    name: Build SFM macOS ARM64
    runs-on: macos-15  # Apple Silicon runner
    steps:
      - name: Checkout sing-box-for-apple
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-apple
          ref: ${{ inputs.apple_ref }}
          path: apple
          submodules: recursive
          fetch-depth: 1

      - name: Checkout reF1nd sing-box core
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: ${{ inputs.core_ref }}
          path: core
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.25.12'
          cache-dependency-path: core/go.sum

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest

      - name: Get version info
        id: version
        run: |
          cd core
          VERSION=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Core version: ${VERSION}"

      - name: Build Libbox.xcframework (macOS ARM64 only)
        working-directory: core
        run: |
          go run ./cmd/internal/build_libbox -target apple -platform macos/arm64

      - name: Copy Libbox to apple project
        run: cp -R core/Libbox.xcframework apple/

      - name: Build SFM.app
        working-directory: apple
        env:
          DISABLE_SWIFTLINT: '1'
        run: |
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFM \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/SFM.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ARCHS=arm64

      - name: Package
        run: |
          APP="apple/build/SFM.xcarchive/Products/Applications/SFM.app"
          VERSION="${{ steps.version.outputs.version }}"
          
          mkdir -p dist

          # zip
          ditto -c -k --keepParent "$APP" "dist/SFM-${VERSION}-macOS-arm64.zip"
          
          # dmg
          hdiutil create \
            -volname "SFM" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "dist/SFM-${VERSION}-macOS-arm64.dmg"

          echo "=== 打包完成 ==="
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SFM-${{ steps.version.outputs.version }}-macOS-arm64
          path: dist/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sfm-${{ steps.version.outputs.version }}
          name: "SFM ${{ steps.version.outputs.version }} (macOS ARM64)"
          body: |
            使用 reF1nd 第三方内核编译的 SFM macOS 客户端（ARM64）

            | 项目 | 值 |
            |---|---|
            | 内核来源 | [`reF1nd/sing-box`](https://github.com/reF1nd/sing-box) |
            | 内核版本 | `${{ inputs.core_ref }}` → `${{ steps.version.outputs.version }}` |
            | 客户端来源 | [`sing-box-for-apple`](https://github.com/SagerNet/sing-box-for-apple) @ `${{ inputs.apple_ref }}` |
            | 架构 | `arm64` (Apple Silicon) |
            
            > 首次打开如遇安全提示，终端运行: `xattr -cr /Applications/SFM.app`
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
